<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALLING OPS — Calendar Roster</title>
<style>
:root{--bg:#04070b;--panel:#091019;--line:#183243;--cyan:#20e6ff;--text:#e9faff;--muted:#7590a0;--green:#39e58d;--amber:#ffc857;--red:#ff6078}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123143,#04070b 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.header{position:sticky;top:0;z-index:20;background:#05080dee;backdrop-filter:blur(16px);border-bottom:1px solid #20e6ff33;padding:16px}
.top{max-width:1800px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{color:var(--cyan);font-weight:900;letter-spacing:3px}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.live{color:var(--green);border:1px solid #39e58d55;padding:7px 10px;border-radius:99px;font-size:10px}
.controls{max-width:1800px;margin:13px auto 0;display:flex;gap:8px;flex-wrap:wrap}
input,select,button{background:#0a121a;color:var(--text);border:1px solid #244352;border-radius:9px;padding:9px 12px}button{cursor:pointer}input{min-width:230px}
.wrap{max-width:1800px;margin:16px auto;padding:0 14px}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:21px;font-weight:800;letter-spacing:1px}.status{font-size:10px;color:var(--muted)}
.calendar-wrap{overflow:auto;border:1px solid #173243;border-radius:14px;background:#060b11;box-shadow:0 10px 35px #0007}
table{border-collapse:separate;border-spacing:0;min-width:1500px;width:max-content}th,td{border-right:1px solid #142b39;border-bottom:1px solid #142b39}
thead th{position:sticky;top:0;background:#0b151f;color:#8defff;z-index:5;padding:10px 8px;font-size:10px;letter-spacing:1px;text-align:center;min-width:82px}
thead th:first-child{left:0;z-index:8;min-width:125px}thead th:nth-child(2){left:125px;z-index:8;min-width:100px}
tbody td{padding:7px 5px;text-align:center;font-size:10px;min-width:82px;height:55px;background:#080e15}
tbody td.name,tbody td.loc{position:sticky;z-index:4;background:#09131c;text-align:left}
tbody td.name{left:0;min-width:125px;font-weight:800;color:#fff}.loc{left:125px;min-width:100px;color:var(--muted)}
.dayhead{font-size:11px;font-weight:800}.dow{font-size:8px;color:var(--muted);display:block;margin-top:3px}
.shift{display:inline-block;padding:5px 6px;border-radius:7px;border:1px solid #245065;background:#0b1a24;color:#a7f5ff;white-space:nowrap}
.wo{color:var(--amber);background:#201a0b;border-color:#765b20}.leave{color:var(--red);background:#210c13;border-color:#733143}.work{color:var(--green);background:#071c13;border-color:#246044}
.empty{color:#3c5260}
.today{background:#0b2028!important;box-shadow:inset 0 0 0 1px #20e6ff88}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{padding:5px 9px;border-radius:7px;font-size:9px;border:1px solid #244352;color:var(--muted)}
@media(max-width:700px){.logo{font-size:15px}.sub{display:none}.calendar-wrap{border-radius:8px}}
</style></head>
<body>
<header class="header"><div class="top"><div><div class="logo">◈ CALLING OPS // CALENDAR ROSTER</div><div class="sub">EMPLOYEE × DATE SHIFT MATRIX</div></div><div class="live">● LIVE</div></div>
<div class="controls"><input id="search" placeholder="Search employee / ID / location..." oninput="render()"><button onclick="prev()">‹</button><button onclick="today()">TODAY</button><button onclick="next()">›</button><button onclick="sync()">↻ SYNC</button><button onclick="window.open(SHEET,'_blank')">OPEN SHEET ↗</button></div></header>

<div class="calendar-wrap"><table id="table"></table></div>
<div class="legend"><span class="tag">🟢 WORKING</span><span class="tag">🟡 WO / OFF</span><span class="tag">🔴 LEAVE</span><span class="tag">— NO DATA</span></div></main>
